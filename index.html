<main><h1>Nightwatch Backup</h1>
<p>这是账号所有者自用的加密备份工具。它通过 rclone 将 Restic 加密备份写入本人 Google Drive，供故障恢复使用。</p>
<p>Google 授权范围为 <code>drive.file</code>：仅访问此应用创建或用户明确授权给此应用的文件。它不提供公共注册、交易、提现或账户查询服务。</p>
<p>此网页只说明备份用途，不展示任何私人监控数据、账户余额、交易记录或服务器访问入口。</p>
<p><a href="privacy.html">隐私与数据使用说明 / Privacy</a></p>
<p>联系维护者：使用 Google 授权页面显示的应用支持邮箱。</p></main></html>
